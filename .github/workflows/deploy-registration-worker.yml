name: Deploy SIPANDU Registration Worker

on:
  push:
    branches: [main]
    paths:
      - "registration-worker/**"
      - ".github/workflows/deploy-registration-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "registration-worker/**"
      - ".github/workflows/deploy-registration-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-registration-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy registration Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Verify Worker source and configuration
        run: |
          set -euo pipefail
          test -f registration-worker/index.ts
          test -f registration-worker/index.test.ts
          test -f registration-worker/wrangler.jsonc
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('registration-worker/wrangler.jsonc', 'utf8'));
          if (config.name !== 'sipandu-registration') throw new Error('Unexpected Worker name.');
          if (config.main !== 'index.runtime.js') throw new Error('Unexpected Worker bundle entry point.');
          const kv = config.kv_namespaces?.find((item) => item.binding === 'PENDING_REGISTRATIONS');
          if (!kv || kv.id !== '49fbf170f6f6410f9ae787a7cc63ffb9') {
            throw new Error('The existing PENDING_REGISTRATIONS namespace binding is missing or mismatched.');
          }
          console.log('Worker TypeScript source, bundle entry point and KV binding verified.');
          NODE

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run registration Worker security tests
        run: bunx tsx --test registration-worker/index.test.ts

      - name: Bundle reviewed TypeScript Worker source
        run: bunx esbuild registration-worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=registration-worker/index.runtime.js

      - name: Validate generated Worker bundle
        run: node --check registration-worker/index.runtime.js

      - name: Install Wrangler in an isolated directory
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install \
            --prefix "$RUNNER_TEMP/wrangler-cli" \
            --no-save \
            --no-audit \
            --no-fund \
            "wrangler@4.136.3"

      - name: Validate Wrangler deployment bundle without publishing
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        working-directory: registration-worker
        run: "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.jsonc

      - name: Deploy Worker with Wrangler configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        working-directory: registration-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0f751dca493cdf222b4c7cd084647f67"
        run: |
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --config wrangler.jsonc
