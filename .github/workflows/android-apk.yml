name: Android private release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.json"
      - "vite.config.ts"
      - "scripts/patch_native_google_login.py"
      - "scripts/generate_pwa_icons.py"
      - "scripts/generate_android_icons.py"
      - "scripts/verify-dist.mjs"
      - "scripts/verify_apk_native_google_bridge.py"
      - "scripts/patch_social_login_reauth.py"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate private release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing GitHub Actions secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing GitHub Actions secret ANDROID_KEY_PASSWORD" && exit 1)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Google Sign-In error 16 recovery
        run: python3 scripts/patch_social_login_reauth.py

      - name: Apply exact uploaded SIPANDU launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_android_icons.py
          ICON="android/app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher.png"
          FOREGROUND="android/app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png"
          ADAPTIVE="android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -s "$ICON"
          test -s "$FOREGROUND"
          test -s "$ADAPTIVE"
          grep -q 'ic_launcher_foreground' "$ADAPTIVE"
          sha256sum "$ICON" "$FOREGROUND"
          echo "Verified Android launcher assets use public/uploads/sipandu-logo.png."

      - name: Configure native Google Workspace scope authorization
        run: python3 scripts/patch_native_google_login.py

      - name: Verify native biometric plugin registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registries = list(Path("android").rglob("capacitor.plugins.json"))
          if not registries:
              raise SystemExit("Capacitor plugin registry was not generated after sync.")
          content = "\\n".join(path.read_text() for path in registries)
          if "BiometricAuthPlugin" not in content and "capacitor-biometric-auth" not in content.lower() and "biometricauth" not in content.lower():
              raise SystemExit("Native biometric plugin is not registered in the generated Android project.")
          print("Native biometric plugin registration verified:", ", ".join(map(str, registries)))
          PY

      - name: Verify native Google Workspace scope authorization
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main/java -name MainActivity.java -type f -print -quit)"
          test -n "$MAIN_ACTIVITY"
          grep -q 'implements ModifiedMainActivityForSocialLoginPlugin' "$MAIN_ACTIVITY"
          grep -q 'handleGoogleLoginIntent(requestCode, data)' "$MAIN_ACTIVITY"
          grep -q 'IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin' "$MAIN_ACTIVITY"
          echo "Verified MainActivity forwards Google OAuth scope results to Capgo Social Login."

      - name: Align Android build tools with dependency requirements
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER" || { echo "::error::Android sdkmanager was not found"; exit 1; }
          # sdkmanager may close stdin after package metadata is loaded; keep the final command status authoritative, not yes(1) SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          python3 - <<'PY'
          from pathlib import Path

          gradle_files = list(Path("android").rglob("*.gradle")) + list(Path("android").rglob("*.gradle.kts"))
          agp_changed = []
          sdk_changed = []
          for path in gradle_files:
              content = path.read_text()
              updated = content.replace("8.7.2", "8.9.1")
              if updated != content:
                  agp_changed.append(str(path))
              updated = updated.replace("compileSdkVersion = 35", "compileSdkVersion = 36")
              updated = updated.replace("compileSdkVersion 35", "compileSdkVersion 36")
              updated = updated.replace("compileSdk 35", "compileSdk 36")
              if updated != content and str(path) not in sdk_changed:
                  sdk_changed.append(str(path))
              if updated != content:
                  path.write_text(updated)
          if not agp_changed:
              raise SystemExit("Could not locate generated Android Gradle Plugin 8.7.2 declaration")
          if not sdk_changed:
              raise SystemExit("Could not locate generated compile SDK 35 declaration")
          print("Updated AGP in:", ", ".join(agp_changed))
          print("Updated compile SDK in:", ", ".join(sdk_changed))
          PY
          grep -R -n '8.9.1' android --include='*.gradle' --include='*.gradle.kts'
          grep -R -E 'compileSdkVersion =? 36|compileSdk 36' android --include='*.gradle' --include='*.gradle.kts'

      - name: Configure private release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sipandu-release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/sipandu-release.keystore"
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in generated Android Gradle file")
              signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
              s = s.replace(marker, signing + marker, 1)
          release_marker = "release {"
          pos = s.find(release_marker, s.find("buildTypes {"))
          if pos < 0:
              raise SystemExit("Could not find release build type")
          close = s.find("\n        }", pos)
          if close < 0:
              raise SystemExit("Could not locate end of release build type")
          block = s[pos:close]
          if "signingConfig" not in block:
              s = s[:close] + "\n            signingConfig signingConfigs.release" + s[close:]
          p.write_text(s)
          PY
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sipandu-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify Google scope bridge inside signed APK bytecode
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          python3 scripts/verify_apk_native_google_bridge.py "$APK"

      - name: Upload private release APK
        uses: actions/upload-artifact@v4
        with:
          name: sipandu-private-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
