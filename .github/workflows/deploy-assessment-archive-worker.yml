name: Deploy SIPANDU Assessment Archive Worker

on:
  push:
    branches: [main]
    paths:
      - "assessment-archive-worker/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-assessment-archive-worker.yml"

permissions:
  contents: read

concurrency:
  group: sipandu-assessment-archive-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Test, deploy production archive Worker, and verify health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run complete test suite
        run: bun run test

      - name: TypeScript validation
        run: bun run lint

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3

      - name: Deploy isolated assessment archive Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f751dca493cdf222b4c7cd084647f67
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          }
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --config assessment-archive-worker/wrangler.jsonc

      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://sipandu-assessment-archive.aryprayoga139.workers.dev/health \
            | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const result = JSON.parse(input);
              if (result.ready !== true || result.ok !== true) {
                throw new Error("Assessment archive Worker health check failed: " + JSON.stringify(result));
              }
              console.log("Assessment archive Worker is deployed and reports ready.");
            '
