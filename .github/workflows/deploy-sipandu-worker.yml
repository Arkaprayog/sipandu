name: Deploy SIPANDU application Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "scripts/**"
      - ".github/workflows/deploy-sipandu-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    name: Build, verify, and deploy SIPANDU Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Verify Cloudflare Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -d public
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'sipandu') throw new Error('Refusing deployment: Worker name must be sipandu.');
          if (config.assets?.directory !== './dist') throw new Error('Refusing deployment: static assets must come from ./dist.');
          if (config.assets?.not_found_handling !== 'single-page-application') throw new Error('Refusing deployment: SPA fallback is not enabled.');
          console.log('Worker target and static asset configuration verified.');
          NODE

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run application and Worker tests
        run: bun run test

      - name: TypeScript validation
        run: bun run lint

      - name: Build SIPANDU application
        run: bun run build

      - name: Verify production files and asset paths
        run: node scripts/verify-dist.mjs

      - name: Install Wrangler in isolated directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" --version

      - name: Deploy verified build to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f751dca493cdf222b4c7cd084647f67
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          }
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --config wrangler.jsonc
