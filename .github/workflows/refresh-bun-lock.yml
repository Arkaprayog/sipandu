name: Refresh Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/refresh-bun-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sipandu-bun-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile from package.json
        run: |
          bun install
          git diff --check
          if ! git diff --quiet -- package.json; then
            echo "::error::bun install unexpectedly changed package.json; refusing to commit."
            git diff -- package.json
            exit 1
          fi

      - name: Commit updated bun.lock when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json; no update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(deps): sync Bun lockfile with package.json"
          # A normal application commit may land while dependency resolution runs.
          # Rebase our lockfile-only commit onto the latest main instead of losing the update.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
