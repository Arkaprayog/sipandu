name: Refresh Bun lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-bun-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main without persisting credentials into build steps
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate lockfile from package.json
        run: |
          set -euo pipefail
          bun install
          git diff --check
          if ! git diff --quiet -- package.json; then
            echo "::error::bun install unexpectedly changed package.json; refusing to commit."
            git diff -- package.json
            exit 1
          fi

      - name: Commit updated bun.lock when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json; no update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(deps): sync Bun lockfile with package.json"
          # Use the official CLI token only for this single lockfile push.
          gh auth setup-git
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
