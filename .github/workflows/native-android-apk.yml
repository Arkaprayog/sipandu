name: SIPANDU Native Android APK and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sipandu-native-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and verify Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published; requesting it
          # makes sdkmanager exit with "Failed to find package 'tools'".
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install web dependencies
        run: bun install --frozen-lockfile


      - name: Run application tests
        run: bun run test

      - name: TypeScript check
        run: bun run lint

      - name: Build web application
        run: bun run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Upgrade generated Android build tools for AndroidX Browser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle_files = list(Path("android").rglob("*.gradle")) + list(Path("android").rglob("*.gradle.kts"))
          changed = []
          agp_changed = []
          sdk_changed = []
          for path in gradle_files:
              content = path.read_text()
              updated = content.replace("8.7.2", "8.9.1")
              if updated != content:
                  agp_changed.append(str(path))
              updated = updated.replace("compileSdkVersion = 35", "compileSdkVersion = 36")
              updated = updated.replace("compileSdkVersion 35", "compileSdkVersion 36")
              updated = updated.replace("compileSdk 35", "compileSdk 36")
              if updated != content and str(path) not in sdk_changed:
                  sdk_changed.append(str(path))
              if updated != content:
                  path.write_text(updated)
          if not agp_changed:
              raise SystemExit("Could not locate generated Android Gradle Plugin 8.7.2 declaration")
          if not sdk_changed:
              raise SystemExit("Could not locate generated compile SDK 35 declaration")
          print("Updated AGP in:", ", ".join(agp_changed))
          print("Updated compile SDK in:", ", ".join(sdk_changed))
          PY
          grep -R -n '8.9.1' android --include='*.gradle' --include='*.gradle.kts'
          grep -R -E 'compileSdkVersion =? 36|compileSdk 36' android --include='*.gradle' --include='*.gradle.kts'

      - name: Configure native Google API scope callback
        run: python3 scripts/patch_native_google_login.py

      - name: Copy web assets into Android app
        run: npx cap sync android

      - name: Patch Google Sign-In error 16 recovery
        run: python3 scripts/patch_social_login_reauth.py

      - name: Verify native biometric plugin registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registries = list(Path("android").rglob("capacitor.plugins.json"))
          if not registries:
              raise SystemExit("Capacitor plugin registry was not generated after sync.")
          content = "\n".join(path.read_text() for path in registries)
          if "BiometricAuthPlugin" not in content and "capacitor-biometric-auth" not in content.lower() and "biometricauth" not in content.lower():
              raise SystemExit("Native biometric plugin is not registered in the generated Android project.")
          print("Native biometric plugin registration verified:", ", ".join(map(str, registries)))
          PY

      - name: Apply official launcher icon from public/uploads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_android_icons.py
          ICON="android/app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher.png"
          FOREGROUND="android/app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png"
          ADAPTIVE="android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -s "$ICON"
          test -s "$FOREGROUND"
          test -s "$ADAPTIVE"
          grep -q 'ic_launcher_foreground' "$ADAPTIVE"
          sha256sum "$ICON" "$FOREGROUND"
          echo "Verified Android launcher icon is generated from public/uploads/sipandu-logo.png."

      - name: Apply package version to Android APK
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APP_VERSION_CODE="$(node -e "const p=require('./package.json').version.split('.').map(Number); console.log(p[0]*10000+p[1]*100+p[2])")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          GRADLE_FILE="android/app/build.gradle"
          test -f "$GRADLE_FILE"
          sed -i -E "s/versionCode [0-9]+/versionCode $APP_VERSION_CODE/" "$GRADLE_FILE"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" "$GRADLE_FILE"
          grep -E 'versionCode|versionName' "$GRADLE_FILE"
      
      - name: Verify native package, name, version, and launcher assets
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          GRADLE_FILE="android/app/build.gradle"
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          ICON_FILE="android/app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher.png"
          grep -q 'applicationId "id.my.sipandu.odhiv"' "$GRADLE_FILE"
          grep -q "versionName \"$APP_VERSION\"" "$GRADLE_FILE"
          grep -q 'SIPANDU ODHIV' "$STRINGS_FILE"
          test -s "$ICON_FILE"
          echo "Native identity verified: id.my.sipandu.odhiv / SIPANDU ODHIV / v$APP_VERSION"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify debug APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/sipandu-apk-badging.txt
          grep -q "package: name='id.my.sipandu.odhiv'" /tmp/sipandu-apk-badging.txt
          grep -q "versionName='$(node -p "require('./package.json').version")'" /tmp/sipandu-apk-badging.txt
          grep -q "application-label:'SIPANDU ODHIV'" /tmp/sipandu-apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sipandu-debug-signing.txt
          grep -E "Signer #1 certificate SHA-1 digest|Signer #1 certificate SHA-256 digest" /tmp/sipandu-debug-signing.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SIPANDU-ODHIV-debug-APK-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure persistent or first-install release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIPANDU_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIPANDU_RELEASE_KEYSTORE_BASE64 }}
          SIPANDU_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIPANDU_RELEASE_STORE_PASSWORD }}
          SIPANDU_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIPANDU_RELEASE_KEY_ALIAS }}
          SIPANDU_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIPANDU_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/sipandu-release.jks"
          if [ -n "$SIPANDU_RELEASE_KEYSTORE_BASE64" ] && [ -n "$SIPANDU_RELEASE_STORE_PASSWORD" ] && [ -n "$SIPANDU_RELEASE_KEY_ALIAS" ] && [ -n "$SIPANDU_RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$SIPANDU_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "Using the configured persistent SIPANDU release signing key."
            echo "SIPANDU_SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="sipandu-release"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=SIPANDU ODHIV, OU=Release, O=SIPANDU, L=Medan, ST=Sumatera Utara, C=ID"
            echo "::warning::Persistent signing secrets are not configured. This APK can be installed, but future updates may not install over it until the same keystore is saved in GitHub Actions secrets."
            echo "SIPANDU_SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "SIPANDU_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIPANDU_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIPANDU_RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "SIPANDU_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          if [ -n "$SIPANDU_RELEASE_STORE_PASSWORD" ]; then echo "SIPANDU_KEYSTORE_PASSWORD=$SIPANDU_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "$SIPANDU_RELEASE_KEY_ALIAS" ]; then echo "SIPANDU_KEY_ALIAS=$SIPANDU_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"; fi
          if [ -n "$SIPANDU_RELEASE_KEY_PASSWORD" ]; then echo "SIPANDU_KEY_PASSWORD=$SIPANDU_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

      - name: Configure Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          def block_span(source, keyword, search_from=0):
              match = re.search(r"(?m)^\s*" + re.escape(keyword) + r"\s*\{", source[search_from:])
              if not match:
                  return None
              begin = search_from + match.start()
              brace = source.find("{", search_from + match.start())
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return begin, pos + 1
              raise SystemExit("Unclosed Gradle block: " + keyword)

          signing_block = """    signingConfigs {
              release {
                  storeFile file(System.getenv('SIPANDU_KEYSTORE_PATH'))
                  storePassword System.getenv('SIPANDU_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('SIPANDU_KEY_ALIAS')
                  keyPassword System.getenv('SIPANDU_KEY_PASSWORD')
              }
          }"""

          span = block_span(s, "signingConfigs")
          if span:
              s = s[:span[0]] + signing_block + s[span[1]:]
          else:
              build_span = block_span(s, "buildTypes")
              if not build_span:
                  raise SystemExit("Android buildTypes block was not found")
              s = s[:build_span[0]] + signing_block + "\n\n    " + s[build_span[0]:]

          build_span = block_span(s, "buildTypes")
          release_span = block_span(s, "release", build_span[0] if build_span else 0)
          if not release_span:
              raise SystemExit("Release build type was not found")
          release_block = s[release_span[0]:release_span[1]]
          if "signingConfig signingConfigs.release" not in release_block:
              opening_end = release_block.find("{") + 1
              release_block = release_block[:opening_end] + "\n            signingConfig signingConfigs.release" + release_block[opening_end:]
              s = s[:release_span[0]] + release_block + s[release_span[1]:]

          p.write_text(s)
          content = p.read_text()
          if r"\n" in content:
              raise SystemExit("Unexpected literal backslash-n in generated Gradle file")
          required = [
              "storePassword System.getenv('SIPANDU_KEYSTORE_PASSWORD')",
              "keyAlias System.getenv('SIPANDU_KEY_ALIAS')",
              "keyPassword System.getenv('SIPANDU_KEY_PASSWORD')",
              "signingConfig signingConfigs.release",
          ]
          missing = [item for item in required if item not in content]
          if missing:
              raise SystemExit("Release signing configuration incomplete: " + ", ".join(missing))
          print("Release signing configuration verified.")
          PY
          grep -n -A10 -B3 'signingConfigs\|signingConfig signingConfigs.release' android/app/build.gradle

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK package, version, and signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/sipandu-release-badging.txt
          grep -q "package: name='id.my.sipandu.odhiv'" /tmp/sipandu-release-badging.txt
          grep -q "versionName='$(node -p "require('./package.json').version")'" /tmp/sipandu-release-badging.txt
          grep -q "application-label:'SIPANDU ODHIV'" /tmp/sipandu-release-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Verify Google scope bridge inside signed release APK bytecode
        if: github.event_name != 'pull_request'
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          python3 scripts/verify_apk_native_google_bridge.py "$APK"

      - name: Upload native release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SIPANDU-ODHIV-RELEASE-APK-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Prepare stable download assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SIPANDU-ODHIV.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SIPANDU-ODHIV-v${APP_VERSION}.apk"
          sha256sum "$RUNNER_TEMP/SIPANDU-ODHIV.apk" | tee "$RUNNER_TEMP/SIPANDU-ODHIV.sha256"

      - name: Publish versioned GitHub Release and stable APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: SIPANDU ODHIV v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            SIPANDU ODHIV Android native release v${{ env.APP_VERSION }}.

            - Package: `id.my.sipandu.odhiv`
            - Build APK and signature verification passed in GitHub Actions.
            - SHA-256 checksum is included as a release asset.
            - Install the APK on Android. Android may ask permission to install apps from the browser.
            - If the APK was signed with a temporary key, future in-place updates require configuring a persistent signing keystore in GitHub Actions secrets.
          files: |
            ${{ runner.temp }}/SIPANDU-ODHIV.apk
            ${{ runner.temp }}/SIPANDU-ODHIV-v${{ env.APP_VERSION }}.apk
            ${{ runner.temp }}/SIPANDU-ODHIV.sha256
