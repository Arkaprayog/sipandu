name: SIPANDU AI Worker validation and gated deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "sipandu-ai-worker/**"
      - "src/App.tsx"
      - "src/components/SIPANDUAICopilot.tsx"
      - "docs/SIPANDU_AI_COPILOT.md"
      - ".github/workflows/sipandu-ai-worker.yml"
  push:
    branches: ["**"]
    paths:
      - "sipandu-ai-worker/**"
      - "src/App.tsx"
      - "src/components/SIPANDUAICopilot.tsx"
      - "docs/SIPANDU_AI_COPILOT.md"
      - ".github/workflows/sipandu-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-ai-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test, type-check, and dry-run AI Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run existing application unit tests
        run: bun run test

      - name: Run SIPANDU AI Worker unit tests
        run: bunx tsx --test sipandu-ai-worker/src/index.test.ts sipandu-ai-worker/src/analytics.test.ts

      - name: TypeScript validation for existing application
        run: bun run lint

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" --version

      - name: Generate Worker runtime and binding types
        run: $RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler types sipandu-ai-worker/worker-configuration.d.ts --config sipandu-ai-worker/wrangler.jsonc

      - name: Strict TypeScript validation for AI Worker
        run: bunx tsc --noEmit -p sipandu-ai-worker/tsconfig.json

      - name: Verify Worker bundle without deployment
        run: $RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler deploy --dry-run --config sipandu-ai-worker/wrangler.jsonc

  readiness:
    name: Report AI activation prerequisites
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment gate and credential presence without exposing values
        env:
          SIPANDU_AI_DEPLOY_ENABLED: ${{ vars.SIPANDU_AI_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gate="not enabled"
          token="missing"
          if [[ "${SIPANDU_AI_DEPLOY_ENABLED:-}" == "true" ]]; then gate="enabled"; fi
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then token="configured"; fi
          {
            echo "## SIPANDU AI activation readiness"
            echo "- Repository variable SIPANDU_AI_DEPLOY_ENABLED: **$gate**"
            echo "- GitHub Actions secret CLOUDFLARE_API_TOKEN: **$token**"
            if [[ "$gate" != "enabled" ]]; then
              echo "- Next action: set repository variable SIPANDU_AI_DEPLOY_ENABLED to the exact value `true`."
            fi
            if [[ "$token" != "configured" ]]; then
              echo "- Next action: add CLOUDFLARE_API_TOKEN as a GitHub Actions secret with least-privilege Workers deployment permissions."
            fi
            if [[ "$gate" == "enabled" && "$token" == "configured" ]]; then
              echo "- Deployment prerequisites in GitHub are present. Cloudflare Worker deployment can proceed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy isolated AI Worker only when explicitly enabled
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.SIPANDU_AI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3

      - name: Deploy isolated SIPANDU AI Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f751dca493cdf222b4c7cd084647f67
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          }
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --config sipandu-ai-worker/wrangler.jsonc
      - name: Verify deployed Worker health and activation state
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors https://sipandu-ai.aryprayoga139.workers.dev/health)"
          configured="$(printf '%s' "$response" | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => { const d = JSON.parse(s); if (d.service !== "SIPANDU AI Copilot" || d.mode !== "read-only") process.exit(2); process.stdout.write(d.configured === true ? "true" : "false"); });')"
          if [[ "$configured" == "true" ]]; then
            echo "SIPANDU AI Worker is deployed and reports configured=true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Worker deployed, but Gemini/Firebase runtime configuration is incomplete. Add the GEMINI_API_KEY Cloudflare Worker Secret before Copilot can be enabled."
            echo "Worker deployment succeeded, but health reports configured=false. Add the GEMINI_API_KEY Cloudflare Worker Secret." >> "$GITHUB_STEP_SUMMARY"
          fi
