name: SIPANDU AI Worker

on:
  pull_request:
    branches: [main]
    paths:
      - "sipandu-ai-worker/**"
      - "src/components/SIPANDUAICopilot.tsx"
      - "src/App.tsx"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/sipandu-ai-worker.yml"
  push:
    branches: [main]
    paths:
      - "sipandu-ai-worker/**"
      - ".github/workflows/sipandu-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-ai-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and dry-run isolated AI Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run AI privacy and authorization tests
        run: bunx tsx --test sipandu-ai-worker/src/analytics.test.ts sipandu-ai-worker/src/index.test.ts
      - name: Install isolated Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3
      - name: Generate Worker binding types
        working-directory: sipandu-ai-worker
        run: "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" types
      - name: Type-check Worker
        working-directory: sipandu-ai-worker
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Dry-run Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          printf 'GEMINI_API_KEY=ci-dry-run-placeholder\n' > sipandu-ai-worker/.dev.vars
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --dry-run --config sipandu-ai-worker/wrangler.jsonc --outdir "$RUNNER_TEMP/sipandu-ai-dry-run"
          rm -f sipandu-ai-worker/.dev.vars

  deploy:
    name: Deploy isolated SIPANDU AI Worker
    if: github.ref == 'refs/heads/main' && vars.SIPANDU_AI_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install isolated Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrangler-cli"
          npm install --prefix "$RUNNER_TEMP/wrangler-cli" --no-audit --no-fund --no-save wrangler@4.136.3
      - name: Deploy AI Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f751dca493cdf222b4c7cd084647f67
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          "$RUNNER_TEMP/wrangler-cli/node_modules/.bin/wrangler" deploy --config sipandu-ai-worker/wrangler.jsonc
