name: Deploy SIPANDU to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "scripts/generate_pwa_icons.py"
      - "scripts/optimize-login-background.mjs"
      - "scripts/generate_surat_tugas_template.py"
      - "scripts/verify-dist.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker-deploy.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN. Add a scoped Cloudflare API token with Workers Scripts edit permission; never commit or paste the token into source."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production static assets
        run: npm run build

      - name: Validate generated production assets
        run: |
          test -s dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path("dist/index.html").read_text()
          if "assets/" not in html:
              raise SystemExit("dist/index.html does not reference built assets")
          print("Production asset validation passed")
          PY

      - name: Deploy production assets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0f751dca493cdf222b4c7cd084647f67"
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
