name: SIPANDU GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipandu-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bun from npm registry
        run: |
          npm install --global bun@1.4.4
          bun --version
      - name: Verify project entry files
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f src/main.tsx
          test -f src/App.tsx
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test cleanup marker detection
        run: bun run test
      - name: TypeScript check
        run: bun run lint

      - name: Validate Registration Worker source and generated bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('registration-worker/wrangler.jsonc', 'utf8'));
          if (config.name !== 'sipandu-registration' || config.main !== 'index.runtime.js') {
            throw new Error('Unexpected SIPANDU registration Worker target or generated bundle entry.');
          }
          const kv = config.kv_namespaces?.find((item) => item.binding === 'PENDING_REGISTRATIONS');
          if (!kv || kv.id !== '49fbf170f6f6410f9ae787a7cc63ffb9') throw new Error('Registration Worker KV binding mismatch.');
          const required = new Set(config.secrets?.required || []);
          for (const name of ['FIREBASE_SERVICE_ACCOUNT_JSON', 'TURNSTILE_SECRET_KEY', 'FIREBASE_AUTH_API_KEY']) {
            if (!required.has(name)) throw new Error('Missing required Worker secret declaration: ' + name);
          }
          NODE
          bunx esbuild registration-worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/sipandu-registration-worker.js"
          node --check "$RUNNER_TEMP/sipandu-registration-worker.js"
      - name: Validate assessment archive Worker configuration and bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('assessment-archive-worker/wrangler.jsonc', 'utf8'));
          if (config.name !== 'sipandu-assessment-archive' || config.main !== 'index.ts') {
            throw new Error('Unexpected SIPANDU assessment archive Worker target.');
          }
          if (config.vars?.FIREBASE_PROJECT_ID !== 'gen-lang-client-0197631978'
            || config.vars?.GOOGLE_WORKSPACE_EMAIL !== 'aryprayoga139@gmail.com') {
            throw new Error('Assessment archive Worker identity configuration mismatch.');
          }
          if (config.observability?.enabled !== true || config.observability?.traces?.enabled !== true) {
            throw new Error('Assessment archive Worker observability must remain enabled.');
          }
          NODE
          bunx esbuild assessment-archive-worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/sipandu-assessment-archive-worker.js"
          node --check "$RUNNER_TEMP/sipandu-assessment-archive-worker.js"
      - name: Generate PWA, iOS, and favicon icons from the official uploaded logo
        run: python3 scripts/generate_pwa_icons.py
      - name: Build SIPANDU
        run: bun run build
      - name: Verify production assets and relative URLs
        run: node scripts/verify-dist.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
