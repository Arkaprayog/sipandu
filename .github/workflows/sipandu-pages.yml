name: SIPANDU GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sipandu-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify project entry files
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f src/main.tsx
          test -f src/App.tsx
      - name: Install dependencies
        run: bun install
      - name: Install native Google sign-in module for type-check and build
        run: npm install --save --package-lock=false --legacy-peer-deps @capacitor/core@7 @capgo/capacitor-social-login@7 @capacitor/local-notifications@7 @aparajita/capacitor-biometric-auth@7
      - name: Test cleanup marker detection
        run: bun run test
      - name: TypeScript check
        run: bun run lint
      - name: Generate PWA, iOS, and favicon icons from the official uploaded logo
        run: python3 scripts/generate_pwa_icons.py
      - name: Build SIPANDU
        run: bun run build
      - name: Verify production assets and relative URLs
        run: node scripts/verify-dist.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
