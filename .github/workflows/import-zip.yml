name: Import SIPANDU ZIP

on:
  push:
    branches:
      - import/sipandu-odhiv-zip-20261024
    paths:
      - sipandu-odhiv.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/sipandu-odhiv-zip-20261024
          fetch-depth: 0

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          test -f sipandu-odhiv.zip || { echo "sipandu-odhiv.zip is missing"; exit 1; }
          mkdir -p /tmp/sipandu-import
          unzip -q -o sipandu-odhiv.zip -d /tmp/sipandu-import
          source_dir=/tmp/sipandu-import
          if [ ! -f "$source_dir/package.json" ]; then
            candidates=$(find "$source_dir" -mindepth 2 -maxdepth 3 -type f -name package.json -print | head -n 1)
            if [ -n "$candidates" ]; then source_dir="$(dirname "$candidates")"; fi
          fi
          test -f "$source_dir/package.json" || { echo "Could not locate package.json after extraction"; find /tmp/sipandu-import -maxdepth 3 -type f | head -n 80; exit 1; }

          # Keep the repository's existing firestore.rules untouched.
          # Store the ZIP's version separately for review instead of replacing the active rules.
          if [ -f "$source_dir/firestore.rules" ]; then
            mkdir -p import-review
            cp "$source_dir/firestore.rules" import-review/firestore.rules.from-zip
          fi

          # Do not use rsync --delete: retain repository files not present in the ZIP.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/import-zip.yml' \
            --exclude='firestore.rules' \
            --exclude='sipandu-odhiv.zip' \
            "$source_dir/" ./
          rm -f sipandu-odhiv.zip

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import SIPANDU project files from ZIP"
          git push origin HEAD:import/sipandu-odhiv-zip-20261024
